name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run CI on all pull requests regardless of target branch

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Principle of least privilege (CodeQL: actions/missing-workflow-permissions)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 to match flake.nix (nodejs_24) and the arch-test dependency
          # @nielspeter/ts-archunit, which requires Node >=24 (see ADR-012).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build and package extension
        run: npm run build:zip
