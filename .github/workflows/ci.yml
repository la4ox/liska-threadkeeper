name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Run CI on all pull requests regardless of target branch

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Principle of least privilege (CodeQL: actions/missing-workflow-permissions)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Node 24 is the supported engine and is required by the architecture
          # test dependency @nielspeter/ts-archunit (see ADR-012).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build and package extension
        run: npm run build:zip
